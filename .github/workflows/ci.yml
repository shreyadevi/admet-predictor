name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_benchmark:
        description: "Run the full benchmark (3 seeds, full-size models, ~1 hour)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      # With RDKit installed, the chemistry, real-data training and API tests run too.
      - run: pytest -v

  benchmark:
    name: Benchmark and train
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Benchmark (fast on push, full when run manually with full_benchmark)
        run: |
          if [ "${{ inputs.full_benchmark }}" = "true" ]; then
            admet benchmark --seeds 3
          else
            admet benchmark --seeds 1 --fast
          fi
      - name: Train production models
        run: admet train ${{ inputs.full_benchmark == true && ' ' || '--fast' }}
      - name: Smoke-test predictions
        run: admet predict "CC(=O)Oc1ccccc1C(=O)O" "CN1C=NC2=C1C(=O)N(C(=O)N2C)C"
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg TRAIN_ARGS=--fast -t admet-predictor .
      - name: Start the API and call it
        run: |
          docker run -d -p 8080:8080 --name api admet-predictor
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 2; done
          curl -sf -X POST localhost:8080/predict -H 'Content-Type: application/json' \
               -d '{"smiles": ["CC(=O)Oc1ccccc1C(=O)O"]}' | python3 -m json.tool
          docker logs api
