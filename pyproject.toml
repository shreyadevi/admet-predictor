[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "admet-predictor"
version = "1.0.0"
description = "ADMET property prediction (solubility, Tox21 toxicity) from molecular structure"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "shreyadevi" }]
dependencies = [
    "rdkit>=2023.9",
    "scikit-learn>=1.4",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "joblib>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27", "fastapi>=0.110"]

[project.scripts]
admet = "admet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]
